<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Hamper Tells</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #2D2727 0%, #1A1515 100%); min-height: 100vh;">

  <!-- Simple Header -->
  <header class="py-3 border-bottom border-secondary">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-logo text-white" href="index.html">
        Hamper <span class="text-pink">Tells</span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="fas fa-store me-1"></i> Return to Storefront
      </a>
    </div>
  </header>

  <!-- Login Section -->
  <section class="py-5">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="p-4 p-md-5 bg-white rounded-3 border shadow-lg fade-in">
            <div class="text-center mb-4">
              <div class="d-inline-flex p-3 rounded-circle bg-pink mb-3" style="background-color: var(--primary-blush);">
                <i class="fas fa-shield-alt text-burgundy fs-2"></i>
              </div>
              <span class="badge bg-burgundy text-white px-3 py-1 mb-2" style="background-color: var(--accent-burgundy);">Store Management</span>
              <h3 class="font-heading text-burgundy mb-1">Admin Portal</h3>
              <p class="text-muted fs-7">Single-user administrative access for store analytics, monthly financial records & order fulfillment.</p>
            </div>

            <!-- Credentials Helper -->
            <div class="p-3 bg-light rounded-3 border mb-4 fs-7">
              <div class="fw-bold text-burgundy mb-1"><i class="fas fa-key me-1 text-pink"></i> Admin Login Credentials:</div>
              <div>Email: <code>admin@hampertells.com</code></div>
              <div>Password: <code>admin123</code></div>
              <button type="button" class="btn btn-outline-secondary btn-sm mt-2 w-100 py-1 fs-7" onclick="fillAdminCredentials()">
                <i class="fas fa-magic me-1"></i> Quick Fill Admin Credentials
              </button>
            </div>

            <form id="adminLoginForm">
              <div class="mb-3">
                <label class="form-label fs-7 font-heading text-muted">Admin Email ID</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-user-shield text-muted"></i></span>
                  <input type="email" id="adminEmail" class="form-control border-start-0" placeholder="admin@hampertells.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fs-7 font-heading text-muted">Secret Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" id="adminPassword" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" id="btnAdminLogin" class="btn btn-blush btn-lg w-100 mb-3 shadow">
                <i class="fas fa-sign-in-alt me-2"></i> Access Admin Dashboard
              </button>

              <div class="text-center fs-7 text-muted">
                Are you a shopper? <a href="login.html" class="fw-semibold text-pink">Customer Sign In</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/main.js"></script>
  <script>
    function fillAdminCredentials() {
      document.getElementById('adminEmail').value = 'admin@hampertells.com';
      document.getElementById('adminPassword').value = 'admin123';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = API.getUser();
      if (user && user.role === 'admin' && API.getToken()) {
        window.location.href = 'admin.html';
        return;
      }

      const form = document.getElementById('adminLoginForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        const submitBtn = document.getElementById('btnAdminLogin');

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...`;

        try {
          const data = await API.adminLogin(email, password);
          if (data.success && data.user) {
            API.setAuth(data.user, data.user.token);
            Main.showToast(`Admin authenticated! Welcome ${data.user.name} 👑`);
            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 800);
          } else {
            throw new Error(data.message || 'Login failed');
          }
        } catch (error) {
          Main.showToast(error.message || 'Invalid admin credentials', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-sign-in-alt me-2"></i> Access Admin Dashboard`;
        }
      });
    });
  </script>
</body>
</html>
