<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — The Hamper Tells</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-logo" href="index.html">The Hamper <span>Tells</span></a>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="fas fa-store me-1"></i> Storefront</a>
        <a href="register.html" class="btn btn-outline-blush btn-sm rounded-pill px-3">Create Account</a>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="p-4 p-md-5 bg-white rounded-3 border shadow-sm fade-in">
            <div class="text-center mb-4">
              <span class="badge bg-pink text-burgundy border px-3 py-1 mb-2">Customer Account</span>
              <h2 class="font-heading text-burgundy">Welcome Back</h2>
              <p class="text-muted fs-7">Login to view past orders, track deliveries & manage saved addresses.</p>
            </div>

            <!-- Demo Login Box -->
            <div class="p-3 bg-light rounded-3 border mb-4 fs-7">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-burgundy"><i class="fas fa-bolt text-warning me-1"></i> Quick Test Customer:</span>
                <button type="button" class="btn btn-sm btn-outline-dark py-0 px-2 fs-8 rounded-pill" onclick="fillDemoCustomer('ananya@gmail.com', 'password123')">
                  Auto-Fill & Sign In
                </button>
              </div>
              <div class="text-muted fs-8">Demo: <code>ananya@gmail.com</code> | Pass: <code>password123</code></div>
              <div class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
                <span class="text-muted"><i class="fas fa-crown text-warning me-1"></i> Store Owner?</span>
                <a href="admin-login.html" class="btn btn-outline-dark btn-sm py-0 px-2 fs-7">
                  Admin Portal <i class="fas fa-arrow-right ms-1"></i>
                </a>
              </div>
            </div>

            <!-- Login / Details Tabs -->
            <ul class="nav nav-pills nav-fill mb-3 bg-light p-1 rounded-3 fs-7" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active py-2 text-burgundy fw-semibold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login" type="button" role="tab">
                  <i class="fas fa-key me-1"></i> Password Login
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link py-2 text-burgundy fw-semibold" id="tab-quick" data-bs-toggle="pill" data-bs-target="#pane-quick" type="button" role="tab">
                  <i class="fas fa-magic me-1"></i> Add Details (Instant)
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <!-- Pane 1: Standard Password Login -->
              <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
                <form id="loginForm">
                  <div class="mb-3">
                    <label class="form-label fs-7 font-heading text-muted">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="e.g. ananya@gmail.com" required>
                  </div>

                  <div class="mb-4">
                    <label class="form-label fs-7 font-heading text-muted">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                  </div>

                  <button type="submit" class="btn btn-blush btn-lg w-100 mb-3">
                    Login To Account <i class="fas fa-sign-in-alt ms-2"></i>
                  </button>
                </form>
              </div>

              <!-- Pane 2: Instant Customer Details Entry -->
              <div class="tab-pane fade" id="pane-quick" role="tabpanel">
                <form id="quickEntryForm">
                  <div class="mb-2">
                    <label class="form-label fs-7 font-heading text-muted">Your Full Name <span class="text-danger">*</span></label>
                    <input type="text" id="quickName" class="form-control" placeholder="e.g. Sahil Magadum" required>
                  </div>
                  <div class="mb-2">
                    <label class="form-label fs-7 font-heading text-muted">Mobile / WhatsApp Number <span class="text-danger">*</span></label>
                    <input type="tel" id="quickPhone" class="form-control" placeholder="e.g. 9822012345" required>
                  </div>
                  <div class="row g-2 mb-3">
                    <div class="col-7">
                      <label class="form-label fs-7 font-heading text-muted">Email (Optional)</label>
                      <input type="email" id="quickEmail" class="form-control" placeholder="name@email.com">
                    </div>
                    <div class="col-5">
                      <label class="form-label fs-7 font-heading text-muted">City</label>
                      <input type="text" id="quickCity" class="form-control" placeholder="Belagavi">
                    </div>
                  </div>
                  <button type="submit" class="btn btn-blush btn-lg w-100 mb-3">
                    Save Details & Explore <i class="fas fa-arrow-right ms-2"></i>
                  </button>
                </form>
              </div>
            </div>

            <div class="text-center fs-7 text-muted mt-2">
              Don't have an account yet? <a href="register.html" class="fw-semibold">Register here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
